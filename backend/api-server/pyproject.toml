[project]
name = "api-server"
version = "0.1.0"
description = "FastAPI backend implementing openapi.yaml"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pyjwt>=2.9",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore::DeprecationWarning",
]